<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopDesk</title>
<style>
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#16202b; --muted:#5b6a7a; --line:#dbe1e7;
  --primary:#0f766e; --primary-ink:#ffffff; --danger:#b42318; --danger-bg:#fdecea;
  --ok:#17663a; --ok-bg:#e3f4ea; --warn:#8a5a00; --warn-bg:#fdf1d6; --info:#1d4f91; --info-bg:#e4eefb;
  --violet:#5b3fa0; --violet-bg:#eee9fa; --neutral:#4a5766; --neutral-bg:#e8ecf0;
  --radius:6px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10161d; --surface:#18212b; --ink:#e6ebf0; --muted:#9aa8b6; --line:#2b3745;
    --primary:#3fb5a8; --primary-ink:#06201d; --danger:#ff8a80; --danger-bg:#3a1c1a;
    --ok:#6fd39a; --ok-bg:#15301f; --warn:#f0c264; --warn-bg:#382b0e; --info:#8cb8f2; --info-bg:#172a45;
    --violet:#b9a4f0; --violet-bg:#2a2141; --neutral:#b4c0cc; --neutral-bg:#26313d;
  }
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;font-variant-numeric:tabular-nums}
a{color:var(--primary)}
h1{font-size:1.5rem;margin:0;line-height:1.25}
h2{font-size:1.1rem;margin:0 0 .75rem}
.muted{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.topbar{background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2rem;padding:0 1.5rem;height:56px;position:sticky;top:0;z-index:5}
.brand{font-weight:700;font-size:1.1rem;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.topbar nav{display:flex;gap:.25rem;height:100%}
.topbar nav a{display:flex;align-items:center;padding:0 .9rem;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent}
.topbar nav a:hover{color:var(--ink)}
.topbar nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--primary)}
.usermenu{margin-left:auto;display:flex;align-items:center;gap:.6rem;font-size:.9rem}
main{max-width:1120px;margin:0 auto;padding:1.5rem}
footer{max-width:1120px;margin:0 auto;padding:1rem 1.5rem 2rem;color:var(--muted);font-size:.85rem;display:flex;gap:1rem;align-items:center}

.page-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.crumb{display:inline-block;margin-bottom:.5rem;font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font:inherit;font-weight:500;padding:.5rem .9rem;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn.small{padding:.3rem .6rem;font-size:.85rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.filters input,.filters select,.form input,.form select,.form textarea,.inline select{font:inherit;padding:.5rem .65rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink)}
.filters input[type=search]{min-width:260px}
.form{display:grid;gap:1rem;max-width:640px}
.form .field{display:grid;gap:.3rem}
.form label{font-weight:500}
.form input,.form select,.form textarea{width:100%}
.form input[type=checkbox]{width:auto}
.form .check{display:flex;align-items:center;gap:.5rem}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form textarea{min-height:90px;resize:vertical}
.form [aria-invalid="true"]{border-color:var(--danger)}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.field-error{color:var(--danger);font-size:.875rem;margin:0}
.form-error{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger);padding:.6rem .8rem;border-radius:var(--radius)}
.form-actions{display:flex;gap:.6rem;margin-top:.5rem}
[hidden]{display:none!important}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.65rem .85rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;font-size:.875rem;color:var(--muted);background:var(--bg);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:color-mix(in srgb,var(--primary) 5%,transparent)}
td.num,th.num{text-align:right}
td.actions{white-space:nowrap;text-align:right}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:.9rem;color:var(--muted);font-size:.9rem;gap:1rem;flex-wrap:wrap}
.pager div{display:flex;align-items:center;gap:.6rem}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}

.badge{display:inline-block;padding:.1rem .55rem;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--neutral-bg);color:var(--neutral)}
.badge.ok,.st-delivered,.role-admin{background:var(--ok-bg);color:var(--ok)}
.badge.warn,.st-pending{background:var(--warn-bg);color:var(--warn)}
.badge.danger,.st-cancelled{background:var(--danger-bg);color:var(--danger)}
.badge.info,.st-paid,.role-manager{background:var(--info-bg);color:var(--info)}
.st-shipped{background:var(--violet-bg);color:var(--violet)}
.badge.neutral,.role-viewer{background:var(--neutral-bg);color:var(--neutral)}

dl.details{display:grid;grid-template-columns:180px 1fr;gap:.6rem 1rem;margin:0}
dl.details dt{color:var(--muted)}
dl.details dd{margin:0}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:1rem;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}.form .row2{grid-template-columns:1fr}.topbar{gap:1rem;padding:0 .75rem}dl.details{grid-template-columns:120px 1fr}}
.stack{display:grid;gap:1rem}
.inline{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:.9rem}
.timeline li{display:grid;gap:.15rem;padding-left:.9rem;border-left:2px solid var(--line)}
.total-row{display:flex;justify-content:flex-end;gap:1.5rem;padding:.9rem .85rem;font-weight:600;font-size:1.05rem}
.items-table input,.items-table select{width:100%;font:inherit;padding:.4rem .5rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink)}
.items-table td:nth-child(2){width:110px}

.login-wrap{min-height:100vh;display:grid;place-content:center;gap:1.25rem;padding:1.5rem;grid-template-columns:minmax(0,420px)}
.login{display:grid;gap:1rem}
.login h1{font-size:1.75rem}
.demo table{font-size:.85rem}
.demo th,.demo td{padding:.4rem .5rem}

dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);padding:1.25rem;max-width:440px;width:calc(100% - 2rem)}
dialog::backdrop{background:rgba(10,15,20,.55)}
dialog .actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.25rem}
#toasts{position:fixed;right:1rem;bottom:1rem;display:grid;gap:.5rem;z-index:20;max-width:360px}
.toast{background:var(--ink);color:var(--bg);padding:.7rem 1rem;border-radius:var(--radius);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast.error{background:var(--danger);color:#fff}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .15s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:0}}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1rem}
.kpi{display:grid;gap:.15rem}
.kpi strong{font-size:1.75rem;line-height:1.2;letter-spacing:-.01em}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:.75rem}
.bars li{display:grid;grid-template-columns:80px 1fr 32px;align-items:center;gap:.6rem}
.bars li span:last-child{text-align:right;font-weight:600}
.bar{height:10px;background:var(--neutral-bg);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:currentColor;border-radius:999px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<noscript>ShopDesk needs JavaScript to run.</noscript>

<script>
'use strict';
/* ==========================================================================
   ShopDesk — a small back-office app used as a system under test.
   Data lives in localStorage (key "shopdesk.data.v1"); the session in
   "shopdesk.session.v1". All "API" calls are async with a small delay so
   tests must wait properly. Set LATENCY to 0 for instant responses.
   ========================================================================== */
const LATENCY = 250;
const KEY = 'shopdesk.data.v1', SKEY = 'shopdesk.session.v1';
const PAGE_SIZE = 10, LOW_STOCK = 10;
const CATEGORIES = ['Electronics', 'Home', 'Office', 'Sports', 'Books'];
const ROLES = ['admin', 'manager', 'viewer'];
const ORDER_STATUSES = ['pending', 'paid', 'shipped', 'delivered', 'cancelled'];
const NEXT = { pending: ['paid', 'cancelled'], paid: ['shipped', 'cancelled'], shipped: ['delivered'], delivered: [], cancelled: [] };
const OPEN_STATUSES = ['pending', 'paid', 'shipped'];
const PERMS = {
  'products:write': ['admin', 'manager'],
  'products:delete': ['admin'],
  'orders:write': ['admin', 'manager'],
  'users:read': ['admin', 'manager'],
  'users:write': ['admin'],
};
const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

/* ---------- small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const money = n => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
const fmtDate = iso => new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtDateTime = iso => new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const orderNo = o => `ORD-${1000 + o.id}`;
const round2 = n => Math.round(n * 100) / 100;
const app = document.getElementById('app');

/* ---------- data store ---------- */
let db, session;
function persist() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
function persistSession() { try { session ? localStorage.setItem(SKEY, JSON.stringify(session)) : localStorage.removeItem(SKEY); } catch (e) {} }
function boot() {
  try { db = JSON.parse(localStorage.getItem(KEY) || 'null'); session = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) {}
  if (!db || !db.users) { db = seed(); persist(); }
}

function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

function seed() {
  const now = Date.now(), DAY = 864e5;
  const users = [
    ['Alice Admin', 'admin@shopdesk.test', 'Admin123!', 'admin', true],
    ['Marc Manager', 'manager@shopdesk.test', 'Manager123!', 'manager', true],
    ['Vera Viewer', 'viewer@shopdesk.test', 'Viewer123!', 'viewer', true],
    ['Noah Martin', 'noah.martin@shopdesk.test', 'Password123!', 'manager', true],
    ['Priya Nair', 'priya.nair@shopdesk.test', 'Password123!', 'viewer', true],
    ['Lucas Bernard', 'lucas.bernard@shopdesk.test', 'Password123!', 'viewer', false],
  ].map(([name, email, password, role, active], i) => ({ id: i + 1, name, email, password, role, active, createdAt: new Date(now - (220 - i * 25) * DAY).toISOString() }));

  const P = [
    ['Wireless Mouse', 'Electronics', 24.99, 120, true], ['Mechanical Keyboard', 'Electronics', 89.9, 45, true],
    ['USB-C Hub', 'Electronics', 39.5, 8, true], ['27-inch Monitor', 'Electronics', 249, 0, true],
    ['Noise-Cancelling Headphones', 'Electronics', 179, 32, true], ['Webcam 1080p', 'Electronics', 59, 60, true],
    ['Ceramic Mug Set', 'Home', 29.9, 200, true], ['Desk Lamp', 'Home', 34.5, 75, true],
    ['Throw Blanket', 'Home', 45, 5, true], ['Scented Candle', 'Home', 12.5, 300, true], ['Air Purifier', 'Home', 129, 18, true],
    ['Notebook A5 (3-pack)', 'Office', 9.99, 500, true], ['Ergonomic Chair', 'Office', 329, 12, true],
    ['Standing Desk', 'Office', 499, 14, false], ['Whiteboard 60x90', 'Office', 49, 25, true],
    ['Stapler', 'Office', 14.9, 90, true], ['Ballpoint Pens (10)', 'Office', 6.5, 1000, true],
    ['Yoga Mat', 'Sports', 27, 80, true], ['Dumbbell Set 20kg', 'Sports', 74.9, 22, true],
    ['Running Belt', 'Sports', 19, 6, true], ['Water Bottle 1L', 'Sports', 16.5, 150, true], ['Resistance Bands', 'Sports', 15.9, 0, true],
    ['Clean Code', 'Books', 39.9, 40, true], ['Refactoring', 'Books', 44.5, 15, true], ['The Pragmatic Programmer', 'Books', 42, 28, true],
  ];
  const prefix = { Electronics: 'ELE', Home: 'HOM', Office: 'OFF', Sports: 'SPO', Books: 'BOK' }, counter = {};
  const products = P.map(([name, category, price, stock, active], i) => {
    counter[category] = (counter[category] || 1000) + 1;
    const created = new Date(now - (180 - i * 4) * DAY).toISOString();
    return { id: i + 1, sku: `${prefix[category]}-${counter[category]}`, name, category, price, stock, active, description: `${name} from the ${category.toLowerCase()} range.`, createdAt: created, updatedAt: created };
  });

  const customers = [['Emma Dubois', 'emma.dubois@example.com'], ['Liam Chen', 'liam.chen@example.com'], ['Sofia Rossi', 'sofia.rossi@example.com'],
    ['Oliver Smith', 'oliver.smith@example.com'], ['Amara Okafor', 'amara.okafor@example.com'], ['Hugo Lambert', 'hugo.lambert@example.com'],
    ['Chloe Martin', 'chloe.martin@example.com'], ['Mateo Garcia', 'mateo.garcia@example.com'], ['Aisha Khan', 'aisha.khan@example.com'], ['Jonas Weber', 'jonas.weber@example.com']];
  const r = rng(2024), pick = a => a[Math.floor(r() * a.length)];
  const sellable = products.filter(p => p.active);
  const paths = { delivered: ['pending', 'paid', 'shipped', 'delivered'], shipped: ['pending', 'paid', 'shipped'], paid: ['pending', 'paid'], pending: ['pending'], cancelled: ['pending', 'cancelled'] };
  const orders = [];
  for (let i = 1; i <= 30; i++) {
    let status;
    if (i <= 14) status = r() < .8 ? 'delivered' : 'cancelled';
    else if (i <= 22) status = pick(['delivered', 'shipped', 'shipped', 'paid']);
    else status = pick(['pending', 'pending', 'paid', 'paid', 'shipped', 'cancelled']);
    const n = 1 + Math.floor(r() * 3), chosen = new Set();
    while (chosen.size < n) chosen.add(pick(sellable));
    const items = [...chosen].map(p => ({ productId: p.id, sku: p.sku, name: p.name, unitPrice: p.price, qty: 1 + Math.floor(r() * 4) }));
    const created = now - (31 - i) * 2.6 * DAY - Math.floor(r() * 8) * 36e5;
    const [cn, ce] = pick(customers), staff = users[i % 2];
    orders.push({
      id: i, customerName: cn, customerEmail: ce, notes: i % 7 === 0 ? 'Please leave at the front desk.' : '', status, items,
      createdAt: new Date(created).toISOString(), updatedAt: new Date(created + (paths[status].length - 1) * DAY * .8).toISOString(),
      history: paths[status].map((s, k) => ({ status: s, at: new Date(created + k * DAY * .8).toISOString(), by: staff.name })),
    });
  }
  return { users, products, orders, seq: { users: users.length + 1, products: products.length + 1, orders: orders.length + 1 } };
}

/* ---------- pseudo API ---------- */
function filterProducts(f) {
  const q = (f.q || '').toLowerCase();
  return db.products.filter(p =>
    (!q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q)) &&
    (!f.category || p.category === f.category) &&
    (!f.status || (f.status === 'active') === p.active) &&
    (!f.stock || (f.stock === 'out' ? p.stock === 0 : f.stock === 'low' ? p.stock > 0 && p.stock <= LOW_STOCK : p.stock > LOW_STOCK))
  ).sort((a, b) => a.name.localeCompare(b.name));
}
class ApiError extends Error { constructor(message, fields = {}, status = 400) { super(message); this.fields = fields; this.status = status; } }
const currentUser = () => (session && db.users.find(u => u.id === session.userId && u.active)) || null;
const can = p => { const u = currentUser(); return !!u && PERMS[p].includes(u.role); };
const auth = () => { const u = currentUser(); if (!u) throw new ApiError('Please log in.', {}, 401); return u; };
const need = p => { auth(); if (!can(p)) throw new ApiError('You do not have permission to do that.', {}, 403); };
const find = (list, id, label) => { const x = list.find(i => i.id === id); if (!x) throw new ApiError(`${label} not found.`, {}, 404); return x; };
const call = fn => new Promise((resolve, reject) => setTimeout(() => {
  try { const out = fn(); persist(); resolve(out === undefined ? undefined : JSON.parse(JSON.stringify(out))); } catch (e) { reject(e); }
}, LATENCY));
const paginate = (rows, page) => {
  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE)), p = Math.min(Math.max(1, +page || 1), pages);
  return { items: rows.slice((p - 1) * PAGE_SIZE, p * PAGE_SIZE), total: rows.length, page: p, pages };
};
const pubUser = ({ password, ...u }) => u;
const outOrder = o => ({ ...o, orderNo: orderNo(o), total: round2(o.items.reduce((s, i) => s + i.unitPrice * i.qty, 0)) });

function checkProduct(d, id) {
  const e = {};
  const name = String(d.name ?? '').trim(), sku = String(d.sku ?? '').trim().toUpperCase(), desc = String(d.description ?? '').trim();
  if (!name) e.name = 'Enter a product name.'; else if (name.length > 80) e.name = 'Name must be 80 characters or fewer.';
  if (!sku) e.sku = 'Enter a SKU.';
  else if (!/^[A-Z0-9-]{3,20}$/.test(sku)) e.sku = 'SKU must be 3–20 characters: letters, numbers and dashes.';
  else if (db.products.some(p => p.sku === sku && p.id !== id)) e.sku = 'This SKU is already in use.';
  if (!CATEGORIES.includes(d.category)) e.category = 'Select a category.';
  const price = Number(d.price);
  if (String(d.price ?? '').trim() === '' || !isFinite(price) || price <= 0) e.price = 'Price must be greater than 0.';
  else if (price > 100000) e.price = 'Price must be 100,000 or less.';
  else if (Math.abs(price * 100 - Math.round(price * 100)) > 1e-6) e.price = 'Price can have at most 2 decimal places.';
  const stock = Number(d.stock);
  if (String(d.stock ?? '').trim() === '' || !Number.isInteger(stock) || stock < 0) e.stock = 'Stock must be a whole number, 0 or more.';
  if (desc.length > 500) e.description = 'Description must be 500 characters or fewer.';
  if (Object.keys(e).length) throw new ApiError('Fix the errors below.', e);
  return { name, sku, category: d.category, price: round2(price), stock, description: desc, active: !!d.active };
}

function checkOrder(d, existing) {
  const e = {};
  const name = String(d.customerName ?? '').trim(), email = String(d.customerEmail ?? '').trim(), notes = String(d.notes ?? '').trim();
  if (!name) e.customerName = 'Enter the customer name.'; else if (name.length > 80) e.customerName = 'Name must be 80 characters or fewer.';
  if (!email) e.customerEmail = 'Enter the customer email.'; else if (!EMAIL.test(email)) e.customerEmail = 'Enter a valid email address.';
  if (notes.length > 300) e.notes = 'Notes must be 300 characters or fewer.';
  const held = {}; (existing?.items || []).forEach(i => { held[i.productId] = i.qty; });
  const rows = Array.isArray(d.items) ? d.items : [], items = [], seen = new Set();
  if (!rows.length) e.items = 'Add at least one item.';
  for (const row of rows) {
    const p = db.products.find(x => x.id === Number(row.productId)), qty = Number(row.qty);
    if (!p) { e.items = 'Select a product for every item.'; break; }
    if (!p.active && !held[p.id]) { e.items = `“${p.name}” is not available for ordering.`; break; }
    if (seen.has(p.id)) { e.items = `“${p.name}” appears more than once. Combine the quantities.`; break; }
    seen.add(p.id);
    if (!Number.isInteger(qty) || qty < 1) { e.items = `Quantity for “${p.name}” must be a whole number, 1 or more.`; break; }
    const avail = p.stock + (held[p.id] || 0);
    if (qty > avail) { e.items = `Only ${avail} unit${avail === 1 ? '' : 's'} of “${p.name}” available.`; break; }
    items.push({ productId: p.id, sku: p.sku, name: p.name, unitPrice: p.price, qty });
  }
  if (Object.keys(e).length) throw new ApiError('Fix the errors below.', e);
  return { customerName: name, customerEmail: email, notes, items };
}
const restoreStock = items => items.forEach(i => { const p = db.products.find(x => x.id === i.productId); if (p) p.stock += i.qty; });
const takeStock = items => items.forEach(i => { const p = db.products.find(x => x.id === i.productId); if (p) p.stock -= i.qty; });

function checkUser(d, id) {
  const e = {};
  const name = String(d.name ?? '').trim(), email = String(d.email ?? '').trim();
  if (!name) e.name = 'Enter a name.'; else if (name.length > 60) e.name = 'Name must be 60 characters or fewer.';
  if (!email) e.email = 'Enter an email address.';
  else if (!EMAIL.test(email)) e.email = 'Enter a valid email address.';
  else if (db.users.some(u => u.email.toLowerCase() === email.toLowerCase() && u.id !== id)) e.email = 'This email is already in use.';
  if (!ROLES.includes(d.role)) e.role = 'Select a role.';
  if (Object.keys(e).length) throw new ApiError('Fix the errors below.', e);
  return { name, email, role: d.role, active: d.active === true || d.active === 'true' };
}

const api = {
  login: (email, password) => call(() => {
    const u = db.users.find(x => x.email.toLowerCase() === String(email).trim().toLowerCase() && x.password === password);
    if (!u) throw new ApiError('Invalid email or password.', {}, 401);
    if (!u.active) throw new ApiError('This account has been disabled. Contact an administrator.', {}, 403);
    session = { userId: u.id }; persistSession();
  }),
  dashboard: () => call(() => {
    auth();
    const orders = db.orders.map(outOrder), live = orders.filter(o => o.status !== 'cancelled');
    const revenue = round2(live.reduce((sum, o) => sum + o.total, 0));
    return {
      revenue, countedOrders: live.length, avgOrder: live.length ? round2(revenue / live.length) : 0,
      openOrders: orders.filter(o => OPEN_STATUSES.includes(o.status)).length,
      byStatus: Object.fromEntries(ORDER_STATUSES.map(st => [st, orders.filter(o => o.status === st).length])),
      lowStock: db.products.filter(p => p.active && p.stock <= LOW_STOCK).sort((a, b) => a.stock - b.stock || a.name.localeCompare(b.name)),
      recent: [...orders].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 5),
    };
  }),
  products: {
    list: f => call(() => { auth(); return paginate(filterProducts(f), f.page); }),
    all: () => call(() => { auth(); return [...db.products].sort((a, b) => a.name.localeCompare(b.name)); }),
    exportAll: f => call(() => { auth(); return filterProducts(f); }),
    get: id => call(() => { auth(); return find(db.products, id, 'Product'); }),
    create: d => call(() => {
      need('products:write');
      const v = checkProduct(d), now = new Date().toISOString();
      const p = { id: db.seq.products++, ...v, createdAt: now, updatedAt: now }; db.products.push(p); return p;
    }),
    update: (id, d) => call(() => {
      need('products:write');
      const p = find(db.products, id, 'Product'); Object.assign(p, checkProduct(d, id), { updatedAt: new Date().toISOString() }); return p;
    }),
    remove: id => call(() => {
      need('products:delete');
      const p = find(db.products, id, 'Product');
      if (db.orders.some(o => OPEN_STATUSES.includes(o.status) && o.items.some(i => i.productId === id)))
        throw new ApiError('This product is part of open orders and cannot be deleted. Mark it inactive instead.', {}, 409);
      db.products = db.products.filter(x => x !== p);
    }),
  },
  orders: {
    list: f => call(() => {
      auth();
      const q = (f.q || '').toLowerCase();
      const from = f.from ? new Date(f.from + 'T00:00:00').getTime() : null, to = f.to ? new Date(f.to + 'T23:59:59.999').getTime() : null;
      const rows = db.orders.filter(o => {
        const t = new Date(o.createdAt).getTime();
        return (!q || orderNo(o).toLowerCase().includes(q) || o.customerName.toLowerCase().includes(q) || o.customerEmail.toLowerCase().includes(q)) &&
          (!f.status || o.status === f.status) && (from === null || t >= from) && (to === null || t <= to);
      }).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).map(outOrder);
      return paginate(rows, f.page);
    }),
    get: id => call(() => { auth(); return outOrder(find(db.orders, id, 'Order')); }),
    create: d => call(() => {
      const u = auth(); need('orders:write');
      const v = checkOrder(d), now = new Date().toISOString();
      takeStock(v.items);
      const o = { id: db.seq.orders++, ...v, status: 'pending', createdAt: now, updatedAt: now, history: [{ status: 'pending', at: now, by: u.name }] };
      db.orders.push(o); return outOrder(o);
    }),
    update: (id, d) => call(() => {
      need('orders:write');
      const o = find(db.orders, id, 'Order');
      if (o.status !== 'pending') throw new ApiError('Only pending orders can be edited.', {}, 409);
      const v = checkOrder(d, o);
      restoreStock(o.items); takeStock(v.items);
      Object.assign(o, v, { updatedAt: new Date().toISOString() }); return outOrder(o);
    }),
    setStatus: (id, status) => call(() => {
      const u = auth(); need('orders:write');
      const o = find(db.orders, id, 'Order');
      if (!NEXT[o.status].includes(status)) throw new ApiError(`An order that is ${o.status} cannot be changed to ${status}.`, {}, 409);
      if (status === 'cancelled') restoreStock(o.items);
      const now = new Date().toISOString();
      o.status = status; o.updatedAt = now; o.history.push({ status, at: now, by: u.name }); return outOrder(o);
    }),
  },
  users: {
    list: () => call(() => { need('users:read'); return db.users.map(pubUser); }),
    get: id => call(() => { need('users:read'); return pubUser(find(db.users, id, 'User')); }),
    update: (id, d) => call(() => {
      const me = auth(); need('users:write');
      const u = find(db.users, id, 'User'), v = checkUser(d, id);
      if (u.id === me.id && (v.role !== u.role || !v.active))
        throw new ApiError('You cannot change your own role or disable your own account.', { role: 'You cannot change your own role.' }, 409);
      Object.assign(u, v); return pubUser(u);
    }),
  },
};

/* ---------- UI helpers ---------- */
function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.setAttribute('role', type === 'error' ? 'alert' : 'status'); t.setAttribute('data-testid', 'toast'); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 4000);
}
function confirmDialog({ title, message, confirmText = 'Confirm' }) {
  return new Promise(resolve => {
    const d = document.createElement('dialog');
    d.setAttribute('data-testid', 'confirm-dialog'); d.setAttribute('aria-labelledby', 'dlg-title');
    d.innerHTML = `<h2 id="dlg-title">${esc(title)}</h2><p>${esc(message)}</p>
      <div class="actions"><button type="button" class="btn" data-testid="confirm-cancel">Cancel</button>
      <button type="button" class="btn danger solid" data-testid="confirm-accept">${esc(confirmText)}</button></div>`;
    document.body.appendChild(d);
    const done = v => { d.close(); d.remove(); resolve(v); };
    $('[data-testid=confirm-cancel]', d).onclick = () => done(false);
    $('[data-testid=confirm-accept]', d).onclick = () => done(true);
    d.addEventListener('cancel', e => { e.preventDefault(); done(false); });
    d.showModal();
  });
}
const loading = () => '<p class="muted" role="status" data-testid="loading">Loading…</p>';
function csvEscape(v) { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function downloadCsv(filename, header, rows) {
  const lines = [header.map(csvEscape).join(','), ...rows.map(r => r.map(csvEscape).join(','))];
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.setAttribute('data-testid', 'csv-download-link'); document.body.appendChild(a);
  a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const opts = (list, val) => list.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(val) ? ' selected' : ''}>${esc(l)}</option>`).join('');
const field = (label, name, control, hint = '') =>
  `<div class="field"><label for="${name}">${label}</label>${control}${hint ? `<p class="hint">${hint}</p>` : ''}<p class="field-error" data-testid="error-${name}" data-for="${name}" hidden></p></div>`;
const statusBadge = s => `<span class="badge st-${s}" data-testid="order-status">${cap(s)}</span>`;
const stockBadge = n => n === 0 ? '<span class="badge danger">Out of stock</span>' : n <= LOW_STOCK ? '<span class="badge warn">Low stock</span>' : '<span class="badge ok">In stock</span>';
const fmtQS = o => { const p = new URLSearchParams(); for (const [k, v] of Object.entries(o)) if (v !== '' && v != null && !(k === 'page' && +v === 1)) p.set(k, v); const s = p.toString(); return s ? '?' + s : ''; };
const go = p => { location.hash = '#' + p; };
const pagerHtml = (d, label) => {
  const start = d.total ? (d.page - 1) * PAGE_SIZE + 1 : 0, end = Math.min(d.page * PAGE_SIZE, d.total);
  return `<div class="pager" data-testid="pagination"><span data-testid="page-info">Showing ${start}–${end} of ${d.total} ${label}</span>
    <div><button class="btn small" data-page="${d.page - 1}" data-testid="prev-page" ${d.page <= 1 ? 'disabled' : ''}>Previous</button>
    <span data-testid="page-number">Page ${d.page} of ${d.pages}</span>
    <button class="btn small" data-page="${d.page + 1}" data-testid="next-page" ${d.page >= d.pages ? 'disabled' : ''}>Next</button></div></div>`;
};
function showErrors(form, err) {
  $$('[data-for]', form).forEach(p => {
    const msg = err.fields?.[p.dataset.for], input = $('#' + p.dataset.for, form);
    p.hidden = !msg; p.textContent = msg || ''; msg ? p.setAttribute('role', 'alert') : p.removeAttribute('role');
    if (input) msg ? input.setAttribute('aria-invalid', 'true') : input.removeAttribute('aria-invalid');
  });
  const box = $('#form-error', form);
  if (box) { const show = (!Object.keys(err.fields || {}).length || err.showSummary) && err.message; box.hidden = !show; box.textContent = show ? err.message : ''; }
}
const clearErrors = form => showErrors(form, { fields: {}, message: '' });

function render(active, html) {
  const u = currentUser(), cur = n => (active === n ? ' aria-current="page"' : '');
  document.title = 'ShopDesk';
  app.innerHTML = `
  <header class="topbar">

    </nav>

  $('#logout').onclick = logout; $('#reset').onclick = resetData;
}
const content = html => { $('#content').innerHTML = html; };
function showError(e, ctx) {
  if (ctx?.stale()) return;
  if (e.status === 401) { session = null; persistSession(); return router(); }
  const map = { 404: ['Not found', 'not-found'], 403: ['No access', 'forbidden'] };
  const [title, tid] = map[e.status] || ['Something went wrong', 'error-state'];
  const html = `<div class="empty" data-testid="${tid}" role="alert"><h2>${title}</h2><p>${esc(e.message)}</p><a class="btn" href="#/products">Back to products</a></div>`;
  $('#content') ? content(html) : render('', html);
}
const forbidden = () => { render('', '<div id="content"></div>'); showError(new ApiError('Your role does not allow you to open this page.', {}, 403)); };
function logout() { session = null; persistSession(); go('/login'); }
async function resetData() {
  if (!await confirmDialog({ title: 'Reset demo data', message: 'This replaces all products, orders and users with the original sample data and logs you out.', confirmText: 'Reset data' })) return;
  db = seed(); session = null; persist(); persistSession(); toast('Demo data reset');
  location.hash === '#/login' ? router() : go('/login');
}

      <select id="f-status" aria-label="Status" data-testid="filter-status"><option value="">All statuses</option>${opts(ORDER_STATUSES.map(s => [s, cap(s)]), f.status)}</select>
      <label class="inline muted">From <input type="date" id="f-from" aria-label="From date" data-testid="filter-from" value="${esc(f.from)}"></label>
      <label class="inline muted">To <input type="date" id="f-to" aria-label="To date" data-testid="filter-to" value="${esc(f.to)}"></label>

  const results = $('#results'); let seq = 0;

    const my = ++seq; results.innerHTML = loading();
    try {
      const d = await api.orders.list(f);
      if (my !== seq || ctx.stale()) return;
      f.page = d.page;
      if (!d.total) { results.innerHTML = '<div class="empty" data-testid="empty-state">No orders match your filters. Clear the filters or try a different search.</div>'; return; }
      results.innerHTML = `<div class="table-wrap"><table data-testid="order-table"><caption class="sr-only">Orders</caption>
        <thead><tr><th>Order</th><th>Customer</th><th>Date</th><th class="num">Items</th><th class="num">Total</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>

          <td class="num" data-testid="order-total">${money(o.total)}</td>
          <td>${statusBadge(o.status)}</td>
          <td class="actions"><a class="btn small" href="#/orders/${o.id}" data-testid="view-order">View</a></td>
        </tr>`).join('')}</tbody></table></div>${pagerHtml(d, 'orders')}`;
    } catch (e) { if (my === seq) showError(e, ctx); }
  }
  const sync = () => { if (ctx.stale()) return; history.replaceState(null, '', '#/orders' + fmtQS(f)); load(); };
  const q = $('#f-q'); let t;
  $('#filters').addEventListener('submit', e => e.preventDefault());
  q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { f.q = q.value.trim(); f.page = 1; sync(); }, 250); });
  [['status', 'f-status'], ['from', 'f-from'], ['to', 'f-to']].forEach(([k, i]) => $('#' + i).addEventListener('change', e => { f[k] = e.target.value; f.page = 1; sync(); }));

  results.addEventListener('click', e => { const pg = e.target.closest('[data-page]'); if (pg && !pg.disabled) { f.page = +pg.dataset.page; sync(); } });

}

async function orderForm(ctx, id) {
  if (!can('orders:write')) return forbidden();
  render('orders', `<a class="crumb" href="#/orders${id ? '/' + id : ''}">← ${id ? 'Back to order' : 'Orders'}</a><div id="content">${loading()}</div>`);
  let products, order = null;
  try { products = await api.products.all(); if (id) order = await api.orders.get(id); } catch (e) { return showError(e, ctx); }
  if (ctx.stale()) return;
  if (order && order.status !== 'pending') {
    return content(`<div class="empty" data-testid="not-editable"><h2>This order can’t be edited</h2><p>Only pending orders can be edited. ${order.orderNo} is ${order.status}.</p><a class="btn" href="#/orders/${id}">Back to order</a></div>`);
  }
  const held = {}; (order?.items || []).forEach(i => { held[i.productId] = i.qty; });
  const items = order ? order.items.map(i => ({ productId: i.productId, qty: String(i.qty) })) : [{ productId: '', qty: '1' }];
  const byId = pid => products.find(p => p.id === Number(pid));
  const optionsFor = sel => '<option value="">Select a product</option>' + products.filter(p => p.active || held[p.id]).map(p => {
    const avail = p.stock + (held[p.id] || 0), chosen = Number(sel) === p.id;
    return `<option value="${p.id}"${chosen ? ' selected' : ''}${avail <= 0 && !chosen ? ' disabled' : ''}>${esc(p.name)} (${esc(p.sku)}) — ${money(p.price)} — ${avail} in stock</option>`;
  }).join('');

  content(`<div class="page-head"><h1>${id ? `Edit ${order.orderNo}` : 'Create order'}</h1></div>
    <form id="form" class="card form" novalidate data-testid="order-form" style="max-width:860px">
      <div id="form-error" class="form-error" role="alert" data-testid="form-error" hidden></div>
      <div class="row2">
        ${field('Customer name', 'customerName', `<input id="customerName" name="customerName" value="${esc(order?.customerName)}" autocomplete="off">`)}
        ${field('Customer email', 'customerEmail', `<input id="customerEmail" name="customerEmail" type="email" value="${esc(order?.customerEmail)}" autocomplete="off">`)}
      </div>
      <div class="field"><span class="label" style="font-weight:500">Items</span>
        <div class="table-wrap"><table class="items-table" data-testid="order-items-editor"><thead><tr><th>Product</th><th>Quantity</th><th class="num">Unit price</th><th class="num">Subtotal</th><th><span class="sr-only">Remove</span></th></tr></thead><tbody id="item-rows"></tbody></table>
          <div class="total-row"><span>Total</span><span id="order-total" data-testid="order-total">$0.00</span></div></div>
        <div><button type="button" class="btn small" id="add-item" data-testid="add-item-button">Add item</button></div>
        <p class="field-error" id="items-error" data-testid="error-items" data-for="items" hidden></p></div>
      ${field('Notes', 'notes', `<textarea id="notes" name="notes">${esc(order?.notes)}</textarea>`, 'Optional. Delivery instructions or internal remarks.')}
      <div class="form-actions"><button class="btn primary" id="submit" data-testid="save-order-button">${id ? 'Save changes' : 'Create order'}</button>
        <a class="btn" href="#/orders${id ? '/' + id : ''}" data-testid="cancel-button">Cancel</a></div>
    </form>`);
  const form = $('#form'), tbody = $('#item-rows');
  const drawRows = () => {
    tbody.innerHTML = items.map((it, i) => `<tr data-testid="item-row" data-i="${i}">
      <td><select aria-label="Product" data-testid="item-product">${optionsFor(it.productId)}</select></td>
      <td><input type="number" min="1" step="1" aria-label="Quantity" data-testid="item-qty" value="${esc(it.qty)}"></td>
      <td class="num" data-testid="item-price"></td><td class="num" data-testid="item-subtotal"></td>
      <td class="actions"><button type="button" class="btn small danger" data-testid="remove-item" ${items.length === 1 ? 'disabled' : ''}>Remove</button></td></tr>`).join('');
    totals();
  };
  const totals = () => {
    let sum = 0;
    $$('tr', tbody).forEach((tr, i) => {
      const p = byId(items[i].productId), qty = Number(items[i].qty) || 0, line = p ? p.price * qty : 0; sum += line;
      $('[data-testid=item-price]', tr).textContent = p ? money(p.price) : '—'; $('[data-testid=item-subtotal]', tr).textContent = p ? money(line) : '—';
    });
    $('#order-total').textContent = money(round2(sum));
  };
  tbody.addEventListener('change', e => { const i = +e.target.closest('tr').dataset.i; if (e.target.matches('select')) items[i].productId = e.target.value; else items[i].qty = e.target.value; totals(); });
  tbody.addEventListener('input', e => { if (e.target.matches('input')) { items[+e.target.closest('tr').dataset.i].qty = e.target.value; totals(); } });
  tbody.addEventListener('click', e => { const b = e.target.closest('[data-testid=remove-item]'); if (b && !b.disabled) { items.splice(+b.closest('tr').dataset.i, 1); drawRows(); } });
  $('#add-item').onclick = () => { items.push({ productId: '', qty: '1' }); drawRows(); };
  drawRows();
  form.addEventListener('submit', async e => {
    e.preventDefault(); clearErrors(form);
    const el = form.elements, data = { customerName: el.customerName.value, customerEmail: el.customerEmail.value, notes: el.notes.value, items: items.map(i => ({ ...i })) };
    const btn = $('#submit'), label = btn.textContent; btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const saved = id ? await api.orders.update(id, data) : await api.orders.create(data);
      toast(id ? 'Order updated' : 'Order created'); go('/orders/' + saved.id);
    } catch (err) { if (ctx.stale()) return; btn.disabled = false; btn.textContent = label; err.showSummary = !!Object.keys(err.fields || {}).length; showErrors(form, err); }
  });
}

/* ---------- router ---------- */
let navId = 0;
async function router() {
  const my = ++navId, ctx = { stale: () => my !== navId };
  const raw = location.hash.replace(/^#/, '') || '/', [path, qs] = raw.split('?'), params = new URLSearchParams(qs || '');
  if (session && !currentUser()) { session = null; persistSession(); }
  const user = currentUser();
  if (path === '/login') return user ? go('/products') : loginPage(ctx, params);
  if (!user) return go('/login' + (path !== '/' ? '?next=' + encodeURIComponent(raw) : ''));
  let m;
  if (path === '/') return go('/products');
  if (path === '/dashboard') return dashboardPage(ctx);
  if (path === '/products') return productsPage(ctx, params);
  if (path === '/products/new') return productForm(ctx, null);
  if ((m = path.match(/^\/products\/(\d+)$/))) return productDetail(ctx, +m[1]);
  if ((m = path.match(/^\/products\/(\d+)\/edit$/))) return productForm(ctx, +m[1]);
  if (path === '/orders') return ordersPage(ctx, params);
  if (path === '/orders/new') return orderForm(ctx, null);
  if ((m = path.match(/^\/orders\/(\d+)$/))) return orderDetail(ctx, +m[1]);
  if ((m = path.match(/^\/orders\/(\d+)\/edit$/))) return orderForm(ctx, +m[1]);
  if (path === '/users') return usersPage(ctx);
  if ((m = path.match(/^\/users\/(\d+)$/))) return userDetail(ctx, +m[1]);
  if ((m = path.match(/^\/users\/(\d+)\/edit$/))) return userForm(ctx, +m[1]);
  render('', '<div id="content"></div>'); showError(new ApiError('This page does not exist.', {}, 404), ctx);
}
